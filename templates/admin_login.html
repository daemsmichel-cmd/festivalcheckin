{% extends "base.html" %}

{% block title %}Admin login | Festival Finder{% endblock %}

{% block content %}
    <section class="shell detail-stack detail-stack--top">
        <section class="section-panel auth-panel">
            <div class="section-header">
                <div>
                    <p class="section-kicker">Admin</p>
                    <h2>Log in</h2>
                </div>
                <p class="section-header__meta">Use the admin account to manage timetable entries and delete crowd check-ins.</p>
            </div>

            <form class="stack-form" method="post" action="{{ url_for('admin_login') }}">
                <input type="hidden" name="next" value="{{ next_url }}">

                <label class="field">
                    <span>Username</span>
                    <input type="text" name="username" autocomplete="username" required>
                </label>

                <label class="field">
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>

                <button class="primary-button" type="submit">Log in as admin</button>
            </form>
        </section>
    </section>
{% endblock %}
